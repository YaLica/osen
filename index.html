<meta name="description" content="Послушай загадку и выбери одну из четырёх картинок.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23f5a623'/%3E%3Ctext x='32' y='48' text-anchor='middle' font-family='Georgia' font-size='50' font-weight='bold' fill='%23532e17'%3E%3F%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--ink:#573516;--orange:#d44d13;--gold:#ffce59;--green:#2d743e}*{box-sizing:border-box}body{margin:0;font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:radial-gradient(ellipse at 50% 10%,#fff9de 10%,#ffe4a0 70%,#ffd178 100%);min-height:100svh}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:4px solid #245c94;outline-offset:5px}button:disabled{cursor:default}button.primary{border:2px solid #a83b12;background:linear-gradient(#ec7022,#cc4713);color:#fff;border-radius:50px;padding:16px 42px;font-size:clamp(22px,3vw,30px);font-weight:bold;box-shadow:0 5px 0 #a93b12,0 9px 22px #9a571524;transition:transform .15s}button.primary:hover{transform:translateY(-2px)}button.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #a93b12}[hidden]{display:none!important}.intro{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px 34px;gap:22px}.cover{width:min(62svh,470px,88vw);height:auto;border-radius:30px;box-shadow:0 12px 48px #7b490d26;border:6px solid #fff9e7}.intro p{font-size:20px;margin:0;text-align:center}.game{max-width:1440px;margin:auto;padding:30px 36px 28px;min-height:100svh;display:flex;flex-direction:column;justify-content:center}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}h1{font-size:clamp(28px,4vw,46px);margin:0;line-height:1.12}#prompt{font-size:clamp(18px,2.3vw,23px);margin:12px 0 0;min-height:1.3em}.listen{display:flex;align-items:center;gap:10px;border:2px solid #bc893e;background:#fffaf0;border-radius:40px;padding:12px 20px;color:var(--ink);font-size:18px;white-space:nowrap}.listen svg{width:24px;height:24px;flex-shrink:0}.listen:disabled{opacity:.5}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;align-items:start}.card{position:relative;display:block;border:5px solid #fffdf5;padding:0;background:#fffdf5;border-radius:24px;box-shadow:0 6px 0 #c7974940,0 12px 24px #8f5d1415;transition:transform .2s,border-color .2s,opacity .2s;overflow:visible;min-width:0}.card img{display:block;width:100%;height:auto;aspect-ratio:1180/1636;object-fit:contain;border-radius:19px}.card:not(:disabled):hover{transform:translateY(-7px)}.card:not(:disabled):active{transform:scale(.97)}.card.correct{border-color:#338b43;transform:translateY(-6px);box-shadow:0 0 0 5px #338b4320,0 14px 30px #326b3230}.card.wrong{border-color:#d47934;animation:shake .4s}.card.rejected{opacity:.52}.badge{position:absolute;right:-10px;top:-14px;width:48px;height:48px;border:4px solid #fffdf5;border-radius:50%;background:var(--green);color:white;font:bold 30px/40px Arial;text-align:center;box-shadow:0 4px 10px #0002}.wrong .badge{background:#d47934}.footer{min-height:88px;padding-top:27px;display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}.result{font-size:clamp(22px,3vw,32px);font-weight:bold;text-align:center;margin:0}.again{background:#fff9e7;color:var(--ink);font-size:20px;padding:12px 24px;border:2px solid #bb883d;border-radius:40px}.sound-error{font:16px/1.5 Arial,sans-serif;text-align:center;color:#9e3414;margin:14px 0 0}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-20px;width:11px;height:18px;border-radius:3px;animation:fall 2.8s ease-in forwards}@keyframes fall{to{transform:translate(var(--drift),110svh) rotate(600deg)}}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}@media(max-width:760px){.game{padding:22px 18px;justify-content:flex-start}.top{align-items:flex-start;margin-bottom:20px}.listen{font-size:0;padding:12px}.listen svg{width:25px;height:25px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:19px 16px;max-width:540px;width:100%;margin:auto}.card{border-width:4px;border-radius:19px}.card img{border-radius:15px}.badge{width:38px;height:38px;font-size:24px;line-height:30px;right:-7px;top:-10px}.footer{padding-top:22px;min-height:80px}.intro p{font-size:18px}}@media(min-width:761px) and (max-height:800px){.game{max-width:1140px;padding-top:22px}.cards{max-width:1050px;width:100%;margin:0 auto}.card img{max-height:54svh}.footer{padding-top:22px;min-height:75px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.confetti{display:none}}
</style>

</head>
<body>
<main>
<section class="intro" id="intro" aria-label="Начало игры">
<h1>Отгадай загадку</h1>
<button class="primary" id="start">Играть</button><p>Послушай загадку и выбери картинку</p>
</section>
<section class="game" id="game" hidden aria-label="Загадка о времени года">
<header class="top"><div><h1>Какое это время года?</h1><p id="prompt" aria-live="polite">Слушай загадку…</p></div><button class="listen" id="listen" aria-label="Послушать загадку ещё раз"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 4 6 8H3v8h3l5 4zM15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></svg><span>Послушать ещё</span></button></header>
<div class="cards" id="cards">
<button class="card" data-answer="winter" aria-label="Зима"><img src="ЗАГАДКИ зима.png" alt="Зима: зайчата в шапках и заснеженный лес" width="861" height="1200"><span class="badge" hidden aria-hidden="true"></span></button>
<button class="card" data-answer="summer" aria-label="Лето"><img src="ЗАГАДКИ лето.png" alt="Лето: медвежонок и оленёнок у пруда" width="862" height="1200"><span class="badge" hidden aria-hidden="true"></span></button>
<button class="card" data-answer="autumn" aria-label="Осень"><img src="ЗАГАДКИ осень.png" alt="Осень: лисёнок и барсук среди золотых листьев" width="866" height="1200"><span class="badge" hidden aria-hidden="true"></span></button>
<button class="card" data-answer="spring" aria-label="Весна"><img src="ЗАГАДКИ весна.png" alt="Весна: ёжик и белочка, цветы и дождик" width="862" height="1200"><span class="badge" hidden aria-hidden="true"></span></button>
</div>
<div class="footer"><p class="result" id="result" role="status" aria-live="polite"></p><button class="again" id="again" hidden>Ещё раз</button></div><p class="sound-error" id="soundError" role="alert" hidden>Не удалось включить звук. Нажми «Послушать ещё».</p>
</section>
</main><div class="confetti" id="confetti" aria-hidden="true"></div>
<audio id="riddle" src="осень.mp3" preload="auto"></audio><audio id="wrong" src="проигрыш.mp3" preload="auto"></audio><audio id="win" src="победа.mp3" preload="auto"></audio>
<script>
'use strict';
const $=id=>document.getElementById(id),cards=[...document.querySelectorAll('.card')],sounds=[$('riddle'),$('wrong'),$('win')];
let phase='intro',round=0,celebrationTimer,audioRun=0;
function stopAudio(){audioRun++;sounds.forEach(a=>{a.pause();a.currentTime=0;a.onended=null;a.onerror=null;});}
function playAudio(audio,onDone){const token=round;stopAudio();const run=audioRun;$('soundError').hidden=true;let completed=false;const done=()=>{if(completed||token!==round||run!==audioRun)return;completed=true;if(onDone)onDone();};const failed=()=>{if(token!==round||run!==audioRun)return;$('soundError').textContent='Не удалось включить звук «'+decodeURIComponent(audio.getAttribute('src'))+'». Проверь, что этот файл лежит рядом с index.html.';$('soundError').hidden=false;done();};audio.onended=done;audio.onerror=failed;try{const playing=audio.play();if(playing)playing.catch(failed);}catch(e){failed();}}
function updateButtons(){cards.forEach(c=>c.disabled=phase!=='playing'||c.classList.contains('rejected'));$('listen').disabled=phase==='feedback'||phase==='won';}
function startRound(){round++;clearTimeout(celebrationTimer);$('confetti').replaceChildren();stopAudio();phase='playing';$('intro').hidden=true;$('game').hidden=false;$('result').textContent='';$('again').hidden=true;cards.forEach(c=>{c.className='card';c.querySelector('.badge').hidden=true;});updateButtons();listen();}
function listen(){if(phase!=='playing')return;$('prompt').textContent='Слушай загадку…';playAudio($('riddle'),()=>{if(phase==='playing')$('prompt').textContent='Нажми на картинку с ответом';});}
function celebrate(){const palette=['#ed6225','#ffbc32','#59a64b','#ebad3f','#be4526'];const frag=document.createDocumentFragment();for(let i=0;i<48;i++){const s=document.createElement('i');s.style.left=(Math.random()*100)+'%';s.style.background=palette[i%palette.length];s.style.animationDelay=(Math.random()*.7)+'s';s.style.setProperty('--drift',(Math.random()*200-100)+'px');frag.append(s);}$('confetti').replaceChildren(frag);celebrationTimer=setTimeout(()=>$('confetti').replaceChildren(),3700);}
function choose(answer){const c=cards.find(c=>c.dataset.answer===answer);if(!c)throw new Error('Неизвестный вариант ответа');if(phase!=='playing'||c.disabled)return {accepted:false,phase};const badge=c.querySelector('.badge');badge.hidden=false;if(answer==='autumn'){phase='won';c.classList.add('correct');badge.textContent='✓';$('prompt').textContent='Ты разгадал загадку!';$('result').textContent='Правильно! Это осень!';$('result').style.color='var(--green)';$('again').hidden=false;updateButtons();celebrate();playAudio($('win'));}else{phase='feedback';c.classList.add('wrong');badge.textContent='×';$('prompt').textContent='Посмотри на другие картинки';$('result').textContent='Попробуй ещё!';$('result').style.color='var(--ink)';updateButtons();playAudio($('wrong'),()=>{c.classList.remove('wrong');c.classList.add('rejected');badge.hidden=true;phase='playing';updateButtons();cards.find(x=>!x.disabled)?.focus({preventScroll:true});});}return {accepted:true,correct:answer==='autumn',phase};}
document.querySelectorAll('.card img').forEach(img=>{const showError=()=>{$('soundError').textContent='Не найдена картинка «'+img.getAttribute('src')+'». Положи её в одну папку с index.html.';$('soundError').hidden=false;};img.addEventListener('error',showError);if(img.complete&&img.naturalWidth===0)showError();});
$('start').addEventListener('click',startRound);$('again').addEventListener('click',startRound);$('listen').addEventListener('click',listen);cards.forEach(c=>c.addEventListener('click',()=>choose(c.dataset.answer)));
</script>
</body></html>
